<!doctype html>
<html>
<head><meta charset="utf-8"><title>KeyValueRows</title></head>
<body>
<div class="mt-slide" style="height:520px;padding:64px 120px">
<div class="mt-rows">
  <div class="mt-row"><span class="mt-row__code code-inline">sorted(book)</span><span class="mt-row__text body">имена по алфавиту</span></div>

  <div class="mt-row"><span class="mt-row__code code-inline">max(groups, key=lambda g: len(groups[g]))</span><span class="mt-row__text body">самая большая группа</span></div>

</div>
